<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팰월드 도우미 시안 v3 (팰/구조물)</title>
<style>
  :root{--bg:#0c0c0c;--panel:#131313;--line:#252525;--hover:#191919;--sel:#1e1e1e;--text:#ececec;--mute:#9a9a9a;--accent:#d9d9d9;--accent2:#ffb84c}
  *{box-sizing:border-box}
  body{margin:0;background:#050505;color:var(--text);font:14px/1.5 "Segoe UI","Malgun Gothic",sans-serif;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .switch{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .switch button{background:#1c1c1c;color:var(--text);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer}
  .switch button.on{background:#d9d9d9;color:#111}
  .app{width:1280px;height:760px;background:var(--bg);border:1px solid var(--line);border-radius:8px;display:flex;overflow:hidden}
  nav{width:200px;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0}
  nav h1{font-size:16px;margin:0 6px 16px;color:var(--accent)}
  nav a{display:flex;gap:8px;padding:9px 10px;border-radius:6px;color:var(--mute);cursor:pointer;margin-bottom:4px}
  nav a.on{background:var(--sel);color:var(--text)}
  main{flex:1;display:flex;min-width:0}
  .list{width:380px;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .search{padding:12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:9px 12px;background:#090909;border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:14px}
  .mode{display:flex;gap:4px;margin-top:8px}
  .mode button{flex:1;background:#090909;border:1px solid var(--line);color:var(--mute);padding:5px;border-radius:6px;cursor:pointer;font-size:12px}
  .mode button.on{background:var(--sel);color:var(--text);border-color:var(--accent)}
  .group{display:flex;gap:4px;margin-top:6px}
  .group button{flex:1;background:none;border:1px dashed var(--line);color:var(--mute);padding:3px;border-radius:6px;cursor:pointer;font-size:12px}
  .group button.on{border-style:solid;color:var(--text);border-color:var(--accent)}
  small.hint{color:var(--mute);display:block;margin-top:6px}
  .tree{overflow:auto;padding:8px;flex:1}
  .row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer}
  .row:hover{background:var(--hover)}.row.sel{background:var(--sel);outline:1px solid var(--accent)}
  .kids{margin-left:16px;border-left:1px solid var(--line);padding-left:6px}
  .arrow{width:12px;color:var(--mute);font-size:10px}
  .ico{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:16px;background:linear-gradient(to top,#3a3a3a,#1c1c1c);flex-shrink:0}
  .ico[data-r="2"]{background:linear-gradient(to top,#27547c,#17283b)}
  .ico[data-r="3"]{background:linear-gradient(to top,#5a2f7c,#241532)}
  .cnt{margin-left:auto;color:var(--mute);font-size:12px}
  .detail{flex:1;padding:24px;overflow:auto}
  .head{display:flex;gap:16px;align-items:center;margin-bottom:12px}
  .head .big{width:88px;height:88px;border-radius:12px;border:1px solid var(--line);overflow:hidden;flex-shrink:0}
  .head .big .ico{width:100%;height:100%;border-radius:0;font-size:44px}
  .head h2{margin:0 0 4px}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{background:var(--sel);color:var(--mute);border-radius:4px;padding:1px 8px;font-size:12px}
  a.tag{color:var(--text);cursor:pointer;border:1px solid #333}a.tag:hover{border-color:var(--accent)}
  .el{padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#111}
  .el-fire{background:#ff7a45}.el-water{background:#4aa8ff}.el-grass{background:#6fd66f}.el-elec{background:#ffd84a}.el-dark{background:#a58bd6}.el-none{background:#d9d9d9}.el-dragon{background:#e0709f}.el-ground{background:#c49a5b}.el-ice{background:#9fe7ff}
  .desc{color:var(--mute);margin:0 0 16px}
  .boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start;margin-bottom:16px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  .box h3{margin:0 0 10px;font-size:14px;color:var(--accent2)}
  table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mute);font-weight:normal;font-size:12px}.n{text-align:right}
  tr.go{cursor:pointer}tr.go:hover td{background:var(--hover)}
  .pts{display:flex;gap:10px;margin-bottom:12px}
  .pt{flex:1;background:#090909;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
  .pt b{display:block;font-size:22px}.pt span{color:var(--mute);font-size:12px}
  .minimap{position:relative;height:260px;border-radius:8px;overflow:hidden;background:#0b141c;border:1px solid var(--line)}
  .minimap .land{position:absolute;border-radius:50%;background:#26382a;opacity:.8}
  .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#ff5a4a;opacity:.7}
  .dot.n{background:#6aa7ff}
  .mm-ctl{display:flex;gap:6px;margin-bottom:8px}
  .mm-ctl button{background:#090909;border:1px solid var(--line);color:var(--mute);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px}
  .mm-ctl button.on{color:var(--text);border-color:var(--accent)}
  .side{width:270px;border-left:1px dashed var(--accent2);padding:12px;font-size:12px;color:var(--mute);overflow:auto}
  .side b{color:var(--accent2)}
</style>
</head>
<body>
<div class="switch" id="sw">
  <b>시안 전환:</b>
  <button data-v="pal" class="on">팰</button>
  <button data-v="pal2">팰 (작업 적성 분류)</button>
  <button data-v="struct">구조물</button>
  <button data-v="item">아이템 (제작대 링크)</button>
  <span style="color:var(--mute)">※ 실제 앱 크기(1280x760) 기준 · 아이콘은 이모지 대용 · 데이터는 샘플</span>
</div>
<div class="app"><nav>
  <h1>팰월드 도우미</h1>
  <a>🗺️ 지도</a><a>🎒 아이템</a><a id="n-pal" class="on">🐾 팰</a><a id="n-struct">🏗️ 구조물</a>
</nav><main id="main"></main></div>

<script>
const EL={none:'무속성',fire:'화염 속성',water:'물 속성',elec:'번개 속성',grass:'풀 속성',dark:'어둠 속성',dragon:'용 속성',ground:'땅 속성',ice:'얼음 속성'};
const PALS=[
 {n:'도로롱',no:'#1',e:['none'],w:['수작업 1','운반 1','목장 1'],i:'🐑',hp:70,atk:70,def:70,ps:'복슬복슬 방패',psd:'발동하면 방패로 변하여 플레이어에게 장착된다. 가축 목장에 배치하면 양털을 떨어뜨리기도 한다.',loc:[['초원 (Lv 1~3)'],['구릉 동굴 (Lv 10~13)']],egg:'평범한 알',drop:'양털 1~3 · 도로롱의 양고기',pts:[[22,40],[30,48],[26,56]]},
 {n:'까부냥',no:'#2',e:['dark'],w:['수작업 1','채집 1','운반 1'],i:'🐱',hp:70,atk:70,def:70,ps:'고양이 손',psd:'파트너로 함께 싸우면 공격이 상승한다.',loc:[['초원 (Lv 1~3)']],egg:'어두운 알',drop:'팰의 체액 · 천',pts:[[40,35],[44,50]]},
 {n:'펭키',no:'#17',e:['water','ice'],w:['물 주기 1','냉각 1','운반 2'],i:'🐧',hp:70,atk:70,def:70,ps:'로켓 펭귄',psd:'탈것으로 활용할 수 있다.',loc:[['설산 (Lv 5~8)']],egg:'축축한 알',drop:'펭키의 깃털',pts:[[60,18],[66,22]]}
];
const STRUCTS={'생산':[
 {n:'원시적인 작업대',i:'🪵',lv:1,pt:1,apt:0,d:'간단한 아이템을 제작하는 작업대. 수작업이 가능한 팰이 필요하다.',m:[['목재',2]],make:['돌 도끼','돌 곡괭이','팰 스피어']},
 {n:'상급 작업대',i:'🔨',lv:11,pt:2,apt:0,d:'아이템 및 방어구를 제작하는 데 필요한 작업대.',m:[['금속 주괴',8],['목재',20],['못',10]],make:['금속 도끼','금속 곡괭이']}],
 '저장':[{n:'나무 상자',i:'📦',lv:1,pt:1,apt:0,d:'아이템을 수납할 수 있다.',m:[['목재',5]],make:[]}],
 '식량':[{n:'모닥불',i:'🔥',lv:1,pt:1,apt:0,d:'식재료를 조리할 때 필요한 시설.',m:[['목재',3],['돌',2]],make:[]}],
 '인프라':[{n:'가축 목장',i:'🐄',lv:5,pt:2,apt:0,d:'팰을 배치하면 자원을 생산한다.',m:[['목재',20],['돌',10]],make:[]}],
 '고대 기술':[{n:'고대 문명 작업대',i:'🗿',lv:30,pt:0,apt:2,d:'고대 문명의 기술로 제작하는 작업대.',m:[['고대 문명의 부품',5],['제련 주괴',20]],make:['돌격 소총']}]};
let S={v:'pal',grp:'el',sel:'도로롱',ssel:'원시적인 작업대',mm:'day'};
const elb=e=>`<span class="el el-${e}">${EL[e]}</span>`;
const dots=(p,cls)=>p.pts.map(([x,y])=>`<span class="dot ${cls}" style="left:${x}%;top:${y}%"></span>`).join('');
function palList(){
  const by={};PALS.forEach(p=>{(S.grp==='el'?p.e.map(e=>EL[e]):p.w.map(w=>w.split(' ')[0])).forEach(k=>(by[k]=by[k]||[]).push(p))});
  return Object.keys(by).map(k=>`<div class="node"><div class="row"><span class="arrow">▼</span><span class="ico">📁</span><span>${k}</span><span class="cnt">${by[k].length}마리</span></div><div class="kids">${by[k].map(p=>`<div class="row ${S.sel===p.n?'sel':''}" data-pal="${p.n}"><span class="arrow"></span><span class="ico" data-r="2">${p.i}</span><span>${p.n}</span><span class="cnt">${p.no}</span></div>`).join('')}</div></div>`).join('');
}
function palDetail(){
  const p=PALS.find(x=>x.n===S.sel);
  return `<div class="detail"><div class="head"><div class="big"><span class="ico" data-r="2">${p.i}</span></div><div><h2>${p.n} <span style="color:var(--mute);font-size:14px">${p.no}</span></h2><div class="tags">${p.e.map(elb).join('')}</div></div></div>
  <div class="boxes">
   <div class="box"><h3>스탯 / 작업 적성</h3><table><tr><td>HP</td><td class="n">${p.hp}</td></tr><tr><td>공격</td><td class="n">${p.atk}</td></tr><tr><td>방어</td><td class="n">${p.def}</td></tr></table><div class="tags" style="margin-top:10px">${p.w.map(w=>`<span class="tag">${w.replace(' ',' Lv.')}</span>`).join('')}</div></div>
   <div class="box"><h3>파트너 스킬: ${p.ps}</h3><p class="desc" style="margin:0">${p.psd}</p></div>
  </div>
  <div class="boxes">
   <div class="box"><h3>어디서 구할 수 있나</h3><table><thead><tr><th>서식지 (레벨)</th></tr></thead>${p.loc.map(l=>`<tr><td>${l[0]}</td></tr>`).join('')}</table>
     <p style="margin:10px 0 0;color:var(--mute);font-size:12px">알: ${p.egg}<br>드롭: ${p.drop}</p></div>
   <div class="box"><h3>서식 분포 지도</h3><div class="mm-ctl"><button class="${S.mm==='day'?'on':''}" data-mm="day">낮</button><button class="${S.mm==='night'?'on':''}" data-mm="night">밤</button><span style="margin-left:auto;font-size:12px;color:var(--mute)">지도 메뉴와 같은 맵 + 점 표시</span></div>
     <div class="minimap"><span class="land" style="left:15%;top:20%;width:45%;height:55%"></span><span class="land" style="left:55%;top:5%;width:30%;height:35%"></span>${dots(p,S.mm==='night'?'n':'')}</div>
     <div style="margin-top:6px"><button style="background:#090909;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer">지도 메뉴에서 크게 보기 →</button></div></div>
  </div></div>`;
}
function structList(){
  return Object.keys(STRUCTS).map(k=>`<div class="node"><div class="row"><span class="arrow">▼</span><span class="ico">📁</span><span>${k}</span><span class="cnt">${STRUCTS[k].length}개</span></div><div class="kids">${STRUCTS[k].map(s=>`<div class="row ${S.ssel===s.n?'sel':''}" data-st="${s.n}"><span class="arrow"></span><span class="ico">${s.i}</span><span>${s.n}</span><span class="cnt">Lv.${s.lv}</span></div>`).join('')}</div></div>`).join('');
}
function structDetail(){
  const s=Object.values(STRUCTS).flat().find(x=>x.n===S.ssel);
  return `<div class="detail"><div class="head"><div class="big"><span class="ico">${s.i}</span></div><div><h2>${s.n}</h2><div class="tags"><span class="tag">${Object.keys(STRUCTS).find(k=>STRUCTS[k].includes(s))}</span></div></div></div>
  <p class="desc">${s.d}</p>
  <div class="pts"><div class="pt"><b>Lv.${s.lv}</b><span>해금 기술 레벨</span></div><div class="pt"><b>${s.pt}</b><span>기술 포인트</span></div><div class="pt"><b>${s.apt}</b><span>고대 기술 포인트</span></div></div>
  <div class="boxes"><div class="box"><h3>건설 재료</h3><table>${s.m.map(m=>`<tr class="go"><td>${m[0]}</td><td class="n">${m[1]}</td></tr>`).join('')}</table></div>
  <div class="box"><h3>여기서 만들 수 있는 아이템</h3>${s.make.length?`<div class="tags">${s.make.map(m=>`<a class="tag">${m}</a>`).join('')}</div>`:'<span style="color:var(--mute)">없음</span>'}</div></div></div>`;
}
function itemDetail(){
  return `<div class="detail"><div class="head"><div class="big"><span class="ico" data-r="2">⛏️</span></div><div><h2>금속 곡괭이</h2><div class="tags"><span class="tag">희귀</span><span class="tag">무기 › 근접 무기</span>
   <a class="tag" title="구조물 페이지로 이동">상급 작업대 ↗</a><a class="tag">무기라인 공장 II ↗</a></div></div></div>
   <p class="desc">채굴용 곡괭이.</p><div class="box"><h3>제작 재료</h3>(이하 기존과 동일)</div></div>`;
}
function render(){
  const v=S.v,m=document.getElementById('main');
  document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('n-pal').classList.toggle('on',v==='pal'||v==='pal2');
  document.getElementById('n-struct').classList.toggle('on',v==='struct');
  let notes='';
  if(v==='pal'||v==='pal2'){
    S.grp=v==='pal'?'el':'work';
    m.innerHTML=`<div class="list"><div class="search"><input placeholder="팰 검색 (예: 도로롱)"><div class="mode"><button class="on">계층</button><button>목록</button><button>그리드</button></div>
    <div class="group"><button class="${S.grp==='el'?'on':''}" data-g="pal">속성별</button><button class="${S.grp==='work'?'on':''}" data-g="pal2">작업 적성별</button></div><small class="hint">전체 299마리 · 폴더 옆 숫자 = 안에 든 팰 수</small></div><div class="tree">${palList()}</div></div>${palDetail()}`;
    notes=`<b>바뀌는 것</b><br>• 왼쪽 메뉴에 팰/구조물 추가<br>• 팰 목록은 아이템과 같은 구성(계층/목록/그리드, 검색, 등급 아이콘)<br>• 계층 기준을 <b>속성별 / 작업 적성별</b> 토글로 선택 (둘 다 가능한 팰은 두 폴더에 모두 표시)<br>• 상세: 속성 배지, 스탯, 작업 적성, 파트너 스킬, 입수처(서식지 레벨·알·드롭), 서식 분포 지도(낮/밤)<br>• 분포 지도는 지도 메뉴와 같은 맵을 재사용<br><br><b>사용자가 정할 것</b><br>• 상세 안 작은 지도 + "지도 메뉴에서 크게 보기"로 둘 다 둘지, 지도 메뉴 쪽만 둘지<br>• 서식지 이름은 게임 내부 지역 코드라 한국어로 직접 정리해야 함(정리 못한 건 코드 그대로 표시)`;
  } else if(v==='struct'){
    m.innerHTML=`<div class="list"><div class="search"><input placeholder="구조물 검색 (예: 작업대)"><div class="mode"><button class="on">계층</button><button>목록</button><button>그리드</button></div><small class="hint">전체 498개 · 게임 건설 분류 기준</small></div><div class="tree">${structList()}</div></div>${structDetail()}`;
    notes=`<b>바뀌는 것</b><br>• 구조물 목록: 게임 건설 분류(생산/저장/식량/인프라…)로 계층, 목록/그리드 동일 제공<br>• 상세: 설명, 해금 기술 레벨, <b>기술 포인트 / 고대 기술 포인트</b>, 건설 재료, 여기서 만들 수 있는 아이템(클릭 시 해당 아이템으로 이동)<br><br><b>사용자가 정할 것</b><br>• 폴더 오른쪽 숫자를 기술 레벨로 표시할지(지금 시안) 다른 것으로 할지`;
  } else {
    m.innerHTML=`<div class="list"><div class="search"><input placeholder="아이템 검색"></div></div>${itemDetail()}`;
    notes=`<b>바뀌는 것</b><br>• 아이템 상세의 제작대 태그가 링크로 바뀜 → 클릭하면 구조물 상세로 이동 (↗ 표시)<br>• 구조물 상세에서도 "만들 수 있는 아이템"으로 반대 방향 이동 가능`;
  }
  m.insertAdjacentHTML('beforeend',`<div class="side">${notes}</div>`);
  m.querySelectorAll('[data-pal]').forEach(r=>r.onclick=()=>{S.sel=r.dataset.pal;render()});
  m.querySelectorAll('[data-st]').forEach(r=>r.onclick=()=>{S.ssel=r.dataset.st;render()});
  m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.v=b.dataset.g;render()});
  m.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{S.mm=b.dataset.mm;render()});
}
document.getElementById('sw').onclick=e=>{const v=e.target.dataset.v;if(v){S.v=v;render()}};
document.getElementById('n-pal').onclick=()=>{S.v='pal';render()};
document.getElementById('n-struct').onclick=()=>{S.v='struct';render()};
render();
</script>
</body>
</html>
